# Nginx interno del contenedor frontend: sirve el SPA de React.
# El HTTPS y el proxy al backend los maneja el nginx de borde (reverse proxy),
# no este. Acá solo se sirve el estático.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router la resuelve).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el index.html para que los deploys se vean sin hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
