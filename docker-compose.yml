services:
  db:
    image: postgres:15-alpine
    container_name: db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend_app
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP_URL: ${APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_SSL_VERIFY: ${AI_SSL_VERIFY:-true}
      INFLACION_API_URL: ${INFLACION_API_URL:-https://apis.datos.gob.ar/series/api/series/}
      INFLACION_SERIE_ID: ${INFLACION_SERIE_ID:-101.1_I2NG_2016_M_22}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: frontend_app
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      HUSKY: 0
    volumes:
      - ./frontend:/app
    # Este bind mount tapa el node_modules que instaló la imagen, así que las
    # dependencias se instalan al arrancar. Si ya están al día, tarda ~1s.
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
