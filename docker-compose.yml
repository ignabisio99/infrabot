services:
  db:
    image: postgres:15-alpine
    container_name: db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    container_name: adminer_infrabot
    restart: always
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: backend_app
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # En desarrollo los mails van a Mailpit (bandeja en http://localhost:8025) y no
      # salen a nadie. Para mandarlos de verdad: SMTP_HOST=smtp.gmail.com y SMTP_PORT=587.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      APP_URL: ${APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_SSL_VERIFY: ${AI_SSL_VERIFY:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:12b}
      OLLAMA_REASONING_EFFORT: ${OLLAMA_REASONING_EFFORT:-}
      INFLACION_API_URL: ${INFLACION_API_URL:-https://apis.datos.gob.ar/series/api/series/}
      INFLACION_SERIE_ID: ${INFLACION_SERIE_ID:-101.1_I2NG_2016_M_22}
      AI_DUPLICADOS_SEMANTICOS: ${AI_DUPLICADOS_SEMANTICOS:-false}
      AI_WHATSAPP: ${AI_WHATSAPP:-false}
      AI_STT_MODEL: ${AI_STT_MODEL:-whisper-1}
      AI_STT_PROVIDER: ${AI_STT_PROVIDER:-local}
      AI_STT_LOCAL_MODEL: ${AI_STT_LOCAL_MODEL:-small}
      AI_STT_BASE_URL: ${AI_STT_BASE_URL:-}
      AI_STT_MODEL_DIR: ${AI_STT_MODEL_DIR:-/models/faster-whisper}
      AI_GEMINI_NATIVE_URL: ${AI_GEMINI_NATIVE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_STT_MOCK_TEXTO: ${AI_STT_MOCK_TEXTO:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEGUIMIENTO_HORAS: ${SEGUIMIENTO_HORAS:-24}
      SEGUIMIENTO_INTERVALO_SEGUNDOS: ${SEGUIMIENTO_INTERVALO_SEGUNDOS:-900}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
      - whisper_models:/models/faster-whisper
    depends_on:
      - db
      - redis
      - mailpit

  mailpit:
    image: axllent/mailpit
    container_name: mailpit_infrabot
    restart: always
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  redis:
    image: redis:7-alpine
    container_name: redis_infrabot
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend_app
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      HUSKY: 0
    volumes:
      - ./frontend:/app
      # Evita que Vite lea node_modules desde OneDrive (en Windows se cuelga el HTTP).
      - frontend_node_modules:/app/node_modules
    command: sh -c "CI=true pnpm install --force && pnpm dev --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  whisper_models:
