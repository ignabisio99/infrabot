# Mismo ruteo que deploy/nginx/infrabot-ssl.conf, pero sin SSL ni Adminer: el HTTPS lo
# termina Tailscale Funnel. Tampoco tiene el rate limit del login, porque detrás de Funnel
# todas las requests llegan con la misma IP y bloquearía a todos a la vez.

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    location = /api/conversaciones/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
    }

    location /webhook/ {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
