# Reverse proxy de borde para producción (corre en la EC2).
# UN SOLO dominio: infrabot.site.
#   - Rutas de la API (auth, reclamos, uploads, webhook, etc.) -> backend
#   - Todo lo demás                                            -> frontend (SPA)
#
# Este archivo tiene SOLO el bloque HTTP (puerto 80):
#   - Sirve el challenge de certbot (para emitir/renovar el certificado).
#   - Redirige todo lo demás a HTTPS.
# El bloque HTTPS (443) vive en infrabot-ssl.conf y se activa DESPUÉS de emitir
# el certificado (ver infra.md). Así el primer arranque de nginx no falla por
# falta de certificados.
#
# Corre dentro de un contenedor nginx que resuelve los nombres de servicio
# "frontend" y "backend" en la red de docker compose.

# Rate limit anti fuerza-bruta para el login: 5 req/min por IP, con ráfaga de 5.
# La zona se define a nivel http (acá) y se aplica en el location de /auth/login
# del bloque SSL (infrabot-ssl.conf).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Ruteo (ver infrabot-ssl.conf):
#   /api/*    -> backend (se le quita el prefijo /api)
#   /api/conversaciones/stream -> SSE sin buffering (ver infrabot-ssl.conf)
#   /uploads/ -> backend (archivos subidos; URL absoluta sin /api)
#   /webhook/ -> backend (webhook de WhatsApp; Meta pega sin /api)
#   resto     -> frontend (SPA). Así F5 en /reclamos, /dashboard, etc. funciona.

server {
    listen 80;
    server_name infrabot.site www.infrabot.site;

    # Challenge de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mientras no exista el certificado (bootstrap), se puede servir directo por
    # HTTP comentando el redirect de abajo y descomentando el proxy. Una vez emitido
    # el cert y activado infrabot-ssl.conf, dejar el redirect a HTTPS.
    location / {
        return 301 https://$host$request_uri;

        # --- Bootstrap sin HTTPS (opcional, para probar antes del cert) ---
        # resolver 127.0.0.11 valid=30s;
        # proxy_pass $upstream_infrabot;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}
