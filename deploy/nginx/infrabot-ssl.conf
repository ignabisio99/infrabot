# Bloque HTTPS (puerto 443) del reverse proxy de borde.
# Requiere que el certificado ya exista en /etc/letsencrypt/live/infrabot.site/.
# (La zona login_limit está definida en infrabot.conf, que nginx carga primero.)
#
# Ruteo por path:
#   /api/*    -> backend (se le quita el prefijo /api antes de pasar)
#   /uploads/ -> backend (archivos subidos; se guardan con URL absoluta /uploads/...)
#   /webhook/ -> backend (webhook de WhatsApp; Meta pega directo, sin /api)
#   resto     -> frontend (SPA); el F5 en cualquier ruta de React funciona.

server {
    listen 443 ssl;
    server_name infrabot.site www.infrabot.site;

    ssl_certificate     /etc/letsencrypt/live/infrabot.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infrabot.site/privkey.pem;

    client_max_body_size 25m; # fotos/videos de reclamos

    # resolver de Docker: permite usar variables en proxy_pass.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:80;
    set $adminer_upstream http://adminer:8080;

    # Login: rate limit anti fuerza-bruta (zona definida en infrabot.conf).
    # Va bajo /api porque el frontend llama a /api/auth/login.
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SSE de chats con operador: sin buffering y con timeout largo.
    location = /api/conversaciones/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 10s;
    }

    # API: todo lo que el frontend llama bajo /api/ va al backend SIN el prefijo.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Archivos subidos: el backend los sirve en /uploads/ (URL absoluta guardada así).
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Webhook de WhatsApp: Meta pega a /webhook/whatsapp sin prefijo /api.
    location /webhook/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Consola de BD (Adminer) en /adminer/. Entrar SIEMPRE con el usuario de solo
    # lectura de Postgres (ver infra.md), NUNCA con el POSTGRES_USER principal.
    #
    # IMPORTANTE: a Adminer se le pasa la URL CON el prefijo /adminer (proxy_pass sin
    # barra final). La imagen oficial de adminer detecta que corre bajo ese subpath y
    # genera sus links y el POST del login bajo /adminer/. Si se le cortara el prefijo
    # (proxy_pass .../), el formulario de login apuntaría a la raíz del sitio (el SPA)
    # y el login "no haría nada" (volvería al formulario).
    location /adminer/ {
        auth_basic "Acceso restringido";
        auth_basic_user_file /etc/nginx/conf.d/.adminer_htpasswd;

        proxy_pass $adminer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /adminer {
        auth_basic "Acceso restringido";
        auth_basic_user_file /etc/nginx/conf.d/.adminer_htpasswd;
        return 301 /adminer/;
    }

    # Todo lo demás: el SPA. El fallback a index.html lo hace el nginx interno del frontend.
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
